{% extends 'base.html' %}

{% block content %}
<div class="w-full max-w-sm p-4 bg-white border border-gray-200 rounded-lg shadow sm:p-6 dark:bg-gray-800 dark:border-gray-700">
    <h1 class="mb-4 text-xl font-semibold text-gray-900 dark:text-white">Sign in</h1>
    <form method="post" class="space-y-4">
        <div>
            <label for="password" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Password</label>
            <input type="password" name="password" id="password" required autofocus autocomplete="current-password"
                   class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:text-white" />
        </div>
        <button type="submit" class="w-full text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800">Sign in</button>
    </form>
    {% if has_passkeys %}
    <div class="flex items-center gap-3 my-4 text-xs text-gray-500 dark:text-gray-400"><span class="flex-1 h-px bg-gray-200 dark:bg-gray-700"></span>or<span class="flex-1 h-px bg-gray-200 dark:bg-gray-700"></span></div>
    <button type="button" id="passkey-sign-in" class="w-full inline-flex items-center justify-center gap-2 text-gray-900 bg-white border border-gray-300 hover:bg-gray-100 focus:ring-4 focus:outline-none focus:ring-gray-200 font-medium rounded-lg text-sm px-5 py-2.5 dark:bg-gray-800 dark:text-white dark:border-gray-600 dark:hover:bg-gray-700 dark:focus:ring-gray-700">
        <svg class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 9.5a3.5 3.5 0 1 1-7 0 3.5 3.5 0 0 1 7 0ZM4 20a7 7 0 0 1 11.2-5.6M18 14v6m0 0 2-2m-2 2-2-2"/></svg>
        Sign in with a passkey
    </button>
    <p id="passkey-error" class="hidden mt-2 text-sm text-red-700 dark:text-red-400" role="alert"></p>
    <script src="{{ url_for('static', filename='js/passkeys.js', v=static_version) }}"></script>
    <script>
    (function () {
        const button = document.getElementById("passkey-sign-in");
        const error = document.getElementById("passkey-error");
        if (!Passkeys.supported()) {
            button.disabled = true;
            error.textContent = "Passkeys need a secure (https) connection in a supported browser.";
            error.classList.remove("hidden");
            return;
        }
        button.addEventListener("click", async function () {
            error.classList.add("hidden");
            try {
                const result = await Passkeys.signIn("{{ url_for('login.passkey_options') }}", "{{ url_for('login.passkey_verify') }}");
                window.location.href = result.redirect;
            } catch (e) {
                error.textContent = e.name === "NotAllowedError" ? "Passkey sign in was cancelled." : e.message;
                error.classList.remove("hidden");
            }
        });
    })();
    </script>
    {% endif %}
</div>
{% endblock %}
