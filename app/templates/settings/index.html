{% extends 'base.html' %}

{% block content %}
<div class="w-full max-w-sm p-4 bg-white border border-gray-200 rounded-lg shadow sm:p-6 md:p-8 dark:bg-gray-800 dark:border-gray-700">
    <a href="{{ url_for('security.index') }}" class="flex items-center justify-between gap-3 p-3 mb-4 text-sm font-medium text-gray-900 rounded-lg bg-gray-50 hover:bg-gray-100 dark:bg-gray-700 dark:text-white dark:hover:bg-gray-600">
        <span>Security: sign in, 2FA &amp; passkeys</span>
        <svg class="w-4 h-4 shrink-0" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m9 5 7 7-7 7"/></svg>
    </a>
    <form class="space-y-3" action="" method="post">
        <div>
            <label for="monzo_client_id" class="block mb-2 text-sm font-medium">Monzo Client ID</label>
            <input type="text" name="monzo_client_id" id="monzo_client_id" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 dark:text-white" value="{{ data['monzo_client_id'] if data['monzo_client_id'] is not none else '' }}" />
        </div>
        <div>
            <label for="monzo_client_secret" class="block mb-2 text-sm font-medium">Monzo Client Secret</label>
            <input type="password" name="monzo_client_secret" id="monzo_client_secret" autocomplete="new-password" placeholder="{{ 'Saved (leave blank to keep)' if secrets_saved['monzo_client_secret'] else 'Not set' }}" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 dark:text-white" />
        </div>

        <div>
            <label for="truelayer_client_id" class="block mb-2 text-sm font-medium">TrueLayer Client ID</label>
            <input type="text" name="truelayer_client_id" id="truelayer_client_id" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 dark:text-white" value="{{ data['truelayer_client_id'] if data['truelayer_client_id'] is not none else '' }}" />
        </div>
        <div>
            <label for="truelayer_client_secret" class="block mb-2 text-sm font-medium">TrueLayer Client Secret</label>
            <input type="password" name="truelayer_client_secret" id="truelayer_client_secret" autocomplete="new-password" placeholder="{{ 'Saved (leave blank to keep)' if secrets_saved['truelayer_client_secret'] else 'Not set' }}" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 dark:text-white" />
        </div>
        <div>
            <label for="sync_interval_seconds" class="block mb-2 text-sm font-medium">Sync Interval (seconds)</label>
            <input type="number" name="sync_interval_seconds" id="sync_interval_seconds" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 dark:text-white" value="{{ data['sync_interval_seconds'] if data['sync_interval_seconds'] is not none else '' }}" />
        </div>
        <div>
            <label for="deposit_cooldown_hours" class="block mb-2 text-sm font-medium">Deposit Cooldown (hours)</label>
            <input type="number" name="deposit_cooldown_hours" id="deposit_cooldown_hours" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 dark:text-white" value="{{ data['deposit_cooldown_hours'] if data['deposit_cooldown_hours'] is not none else '' }}" />
        </div>

        <div>
            <label for="log_retention_days" class="block mb-2 text-sm font-medium">Log History (days)</label>
            <input type="number" min="1" name="log_retention_days" id="log_retention_days" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 dark:text-white" value="{{ data['log_retention_days'] if data['log_retention_days'] is not none else 7 }}" />
        </div>

        <label class="inline-flex items-center cursor-pointer">
            <input type="checkbox" name="enable_sync" class="sr-only peer" {% if data['enable_sync'] %} checked {% endif %} />
            <div class="relative w-14 h-7 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-blue-300 dark:peer-focus:ring-blue-800 rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-0.5 after:start-[4px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-6 after:w-6 after:transition-all dark:border-gray-600 peer-checked:bg-blue-600"></div>
            <span class="ms-3 text-sm font-medium text-gray-900 dark:text-gray-300">Enable Balance Sync</span>
        </label>

        <label class="inline-flex items-center cursor-pointer">
            <input type="checkbox" name="override_cooldown_spending" class="sr-only peer" {% if data['override_cooldown_spending'] %} checked {% endif %} />
            <div class="relative w-14 h-7 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-blue-300 dark:peer-focus:ring-blue-800 rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-0.5 after:start-[4px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-6 after:w-6 after:transition-all dark:border-gray-600 peer-checked:bg-blue-600"></div>
            <span class="ms-3 text-sm font-medium text-gray-900 dark:text-gray-300">Override Cooldown Spending</span>
        </label>

        <label class="inline-flex items-center cursor-pointer">
            <input type="checkbox" name="hide_balances" class="sr-only peer" {% if data['hide_balances'] %} checked {% endif %} />
            <div class="relative shrink-0 w-14 h-7 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-blue-300 dark:peer-focus:ring-blue-800 rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-0.5 after:start-[4px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-6 after:w-6 after:transition-all dark:border-gray-600 peer-checked:bg-blue-600"></div>
            <span class="ms-3 text-sm font-medium text-gray-900 dark:text-gray-300">Hide Amounts on the Home Page</span>
        </label>
        <p class="-mt-2 text-xs text-gray-500 dark:text-gray-400">Show £••••• instead of balances; tap the eye on the home page to reveal them.</p>

        <label class="inline-flex items-center cursor-pointer">
            <input type="checkbox" name="log_history_enabled" class="sr-only peer" {% if data['log_history_enabled'] is none or data['log_history_enabled'] %} checked {% endif %} />
            <div class="relative shrink-0 w-14 h-7 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-blue-300 dark:peer-focus:ring-blue-800 rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-0.5 after:start-[4px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-6 after:w-6 after:transition-all dark:border-gray-600 peer-checked:bg-blue-600"></div>
            <span class="ms-3 text-sm font-medium text-gray-900 dark:text-gray-300">Keep Log History</span>
        </label>
        <p class="-mt-2 text-xs text-gray-500 dark:text-gray-400">Turning this off stops saving sync logs (which include balances) and deletes the history kept so far.</p>
  
        
        <button type="submit" class="w-full mt-10 text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800">Save</button>
    </form>

    <form action="{{ url_for('settings.clear_cooldown') }}" method="post" style="margin-top:1rem;">
        <div class="mb-4">
            <label for="account_type" class="block text-sm font-medium text-gray-900 dark:text-gray-300">Select Account</label>
            <select id="account_type" name="account_type" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 dark:text-white">
                <option value="">All Accounts</option>
                {% for account in accounts %}
                <option value="{{ account.type }}">{{ account.type }} (Pot: {{ account.pot_id }})</option>
                {% endfor %}
            </select>
        </div>
        <button type="submit" class="w-full mt-2 text-white bg-red-700 hover:bg-red-800 focus:ring-4 focus:outline-none focus:ring-red-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center">
            Clear Cooldown
        </button>
    </form>
</div>
{% endblock %}
