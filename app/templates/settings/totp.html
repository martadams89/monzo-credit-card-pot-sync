{% extends 'base.html' %}

{% block content %}
<div class="w-full max-w-sm p-4 bg-white border border-gray-200 rounded-lg shadow sm:p-6 dark:bg-gray-800 dark:border-gray-700">
    <a href="{{ url_for('security.index') }}" class="text-sm text-gray-500 underline dark:text-gray-400">&larr; Security</a>
    <h1 class="mt-1 mb-1 text-xl font-semibold text-gray-900 dark:text-white">Set up two-factor authentication</h1>
    <ol class="mb-4 space-y-1 text-sm text-gray-500 list-decimal list-inside dark:text-gray-400">
        <li>Scan this QR code with your authenticator app.</li>
        <li>Enter the 6-digit code it shows to finish.</li>
    </ol>
    <div class="w-48 h-48 p-2 mx-auto mb-3 bg-white rounded-lg [&>svg]:w-full [&>svg]:h-full" aria-label="QR code for your authenticator app">{{ qr_svg|safe }}</div>
    <details class="mb-4 text-sm">
        <summary class="text-gray-500 cursor-pointer dark:text-gray-400">Can't scan it? Enter this key instead</summary>
        <code class="block p-2 mt-2 font-mono text-sm break-all bg-gray-100 rounded dark:bg-gray-700 dark:text-white">{{ secret }}</code>
    </details>
    <form method="post" class="space-y-3">
        <label for="code" class="block text-sm font-medium text-gray-900 dark:text-white">Code from the app</label>
        <input type="text" name="code" id="code" required autofocus inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]{6,7}" maxlength="7"
               class="bg-gray-50 border border-gray-300 text-gray-900 text-lg tracking-widest text-center rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:text-white" />
        <button type="submit" class="w-full text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800">Turn on two-factor authentication</button>
    </form>
</div>
{% endblock %}
